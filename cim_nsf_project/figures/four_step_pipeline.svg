<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>CIM 晶片從研究到量產的四個步驟</title>
<desc>四個步驟依序為發明新元件、製程整合、電路與晶片設計、量產。NSF 經費集中在第一步，國科會經費集中在第三步（2023 年後研究層次經費占比）；台積電已替 RRAM 與 MRAM 完成第二步，鐵電尚未完成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>
<g font-size="14">
<rect x="45" y="40" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="107.5" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#444441">1 發明新元件</text>
<text x="107.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">大學實驗室</text>
<rect x="200" y="40" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="262.5" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#444441">2 製程整合</text>
<text x="262.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">晶圓廠或試產線</text>
<rect x="355" y="40" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="417.5" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#444441">3 電路與晶片</text>
<text x="417.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">設計後下線</text>
<rect x="510" y="40" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="572.5" y="58" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#444441">4 量產</text>
<text x="572.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">企業主導</text>
<line x1="172" y1="68" x2="196" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="327" y1="68" x2="351" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="68" x2="506" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="107.5" y1="98" x2="107.5" y2="124" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="262.5" y1="98" x2="262.5" y2="124" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="417.5" y1="98" x2="417.5" y2="124" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="45" y="126" width="125" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="107.5" y="144" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#712B13">NSF 經費集中</text>
<text x="107.5" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">元件層 58%</text>
<rect x="200" y="126" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="262.5" y="144" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#444441">台積電已完成</text>
<text x="262.5" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">RRAM、MRAM</text>
<rect x="355" y="126" width="125" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="417.5" y="144" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#085041">國科會經費集中</text>
<text x="417.5" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">電路與架構 62%</text>
<line x1="262.5" y1="184" x2="262.5" y2="210" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="200" y="212" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="262.5" y="230" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#633806">鐵電尚未完成</text>
<text x="262.5" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">無對外製程</text>
</g>
</svg>
